name: Build and Release

# Push (not pull_request) so merges of fork PRs also release: workflows
# triggered by fork pull_request events never receive repository secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and assemble everything, upload the package as an artifact, push nothing"
        type: boolean
        default: false

# Release pushes use the GitHub App token, so GITHUB_TOKEN only needs read.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Skip the bot's own "Release x.y.z" push, which would otherwise loop.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'aloy-the-cat[bot]' &&
       !startsWith(github.event.head_commit.message, 'Release '))
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Generate version
        id: version
        run: |
          # Get latest semver tag (x.y.z format)
          git fetch --tags
          LATEST=$(git tag -l --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)

          if [ -z "$LATEST" ]; then
            # No tags exist - let package.json decide the first version
            AUTO_VERSION="0.0.0"
          else
            # Increment patch version from latest tag
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            AUTO_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          # Get version from package.json
          PKG_VERSION=$(grep '"version"' Package/package.json | sed 's/.*"version": "\([^"]*\)".*/\1/')

          # Use the higher of auto-incremented or package.json version
          # This allows manual minor/major bumps via package.json while
          # still auto-incrementing patches for regular releases
          VERSION=$(printf '%s\n%s' "$AUTO_VERSION" "$PKG_VERSION" | sort -V | tail -n1)

          echo "Latest tag: $LATEST"
          echo "Auto-increment version: $AUTO_VERSION"
          echo "Package.json version: $PKG_VERSION"
          echo "Selected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-windows:
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Windows DLL
        shell: bash
        run: |
          cd Proxy~
          gcc -shared -O2 -DNDEBUG -DMG_ENABLE_LINES=0 -DMG_TLS=MG_TLS_BUILTIN \
            proxy.c mongoose.c \
            -o UnityMCPProxy.dll \
            -lws2_32

      - uses: actions/upload-artifact@v7
        with:
          name: windows-plugin
          path: Proxy~/UnityMCPProxy.dll

  build-macos:
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build macOS Bundle (Universal)
        run: |
          cd Proxy~
          clang -shared -O2 -DNDEBUG -DMG_ENABLE_LINES=0 -DMG_TLS=MG_TLS_BUILTIN \
            proxy.c mongoose.c \
            -o UnityMCPProxy.bundle \
            -arch arm64 -arch x86_64 \
            -framework CoreFoundation -framework Security

      - uses: actions/upload-artifact@v7
        with:
          name: macos-plugin
          path: Proxy~/UnityMCPProxy.bundle

  build-linux:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Linux Shared Library
        run: |
          cd Proxy~
          gcc -shared -fPIC -O2 -DNDEBUG -DMG_ENABLE_LINES=0 -DMG_TLS=MG_TLS_BUILTIN \
            proxy.c mongoose.c \
            -o libUnityMCPProxy.so \
            -lpthread

      - uses: actions/upload-artifact@v7
        with:
          name: linux-plugin
          path: Proxy~/libUnityMCPProxy.so

  release:
    needs: [version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # 'app-id' is deprecated in v3; 'client-id' accepts the App ID or Client ID.
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Exact commit that triggered the run (or the branch chosen for a dry run).
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}
          path: src
          fetch-depth: 0
          fetch-tags: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-plugin
          path: artifacts/windows-plugin

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-plugin
          path: artifacts/macos-plugin

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-plugin
          path: artifacts/linux-plugin

      - name: Determine release state
        id: state
        working-directory: src
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          bash .github/scripts/check-release-ref.sh "$GITHUB_REF" "$DRY_RUN"
          SHORT=$(git rev-parse --short=7 HEAD)
          STATE=$(bash .github/scripts/release-state.sh "$VERSION" "$SHORT")
          echo "Release $VERSION from main@$SHORT: $STATE"
          if [ "$STATE" = "conflict" ]; then
            echo "::error::Tag $VERSION already exists for a different commit."
            exit 1
          fi
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Assemble and commit latest branch
        if: steps.state.outputs.state == 'new'
        working-directory: src
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHORT: ${{ steps.state.outputs.short }}
        run: |
          git config user.name "Aloy the Cat[bot]"
          git config user.email "aloy-the-cat[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin latest >/dev/null; then
            git fetch origin latest:refs/remotes/origin/latest
            git worktree add -B latest ../dist origin/latest
          else
            git worktree add --orphan -b latest ../dist
          fi
          # Assemble from the untouched pushed tree, before the legacy main commit below.
          bash .github/scripts/assemble-package.sh . ../artifacts ../dist "$VERSION"
          bash .github/scripts/verify-package.sh ../dist "$VERSION"
          git -C ../dist add -A
          git -C ../dist commit -q -m "Release $VERSION (from main@$SHORT)"

      # Legacy 2.x path: keep publishing binaries on main (old ?path=/Package layout) and tag there.
      - name: Commit and tag main (legacy layout)
        if: steps.state.outputs.state == 'new'
        working-directory: src
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHORT: ${{ steps.state.outputs.short }}
        run: |
          cp ../artifacts/windows-plugin/UnityMCPProxy.dll Package/Plugins/Windows/x86_64/
          cp ../artifacts/macos-plugin/UnityMCPProxy.bundle Package/Plugins/macOS/
          cp ../artifacts/linux-plugin/libUnityMCPProxy.so Package/Plugins/Linux/x86_64/
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' Package/package.json
          sed -i 's/const string ServerVersion = "[^"]*"/const string ServerVersion = "'"$VERSION"'"/' Package/Editor/Core/MCPServer.cs
          cp README.md LICENSE Package/
          git add Package/Plugins/ Package/package.json Package/Editor/Core/MCPServer.cs Package/README.md Package/LICENSE
          git commit -q -m "Release $VERSION (from main@$SHORT)"
          git tag "$VERSION"

      - name: Upload assembled package (dry run)
        if: inputs.dry_run && steps.state.outputs.state == 'new'
        uses: actions/upload-artifact@v7
        with:
          name: upm-package-${{ needs.version.outputs.version }}
          path: dist/

      - name: Push main, latest and tag
        if: ${{ !inputs.dry_run && steps.state.outputs.state == 'new' }}
        working-directory: src
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Atomic: either all three refs update or none do (e.g. main moved meanwhile).
          git push --atomic origin HEAD:refs/heads/main refs/heads/latest:refs/heads/latest "refs/tags/$VERSION"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        working-directory: src
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --verify-tag --generate-notes
